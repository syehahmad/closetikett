<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generator Tiket Close</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<h1>📋 Generator Tiket Close</h1>

<label>Paste Tiket MyICON+</label>
<textarea id="raw" placeholder="Paste isi tiket MyICON+ di sini..."></textarea>

<button class="full" onclick="ambilData()">Generate Data</button>

<h3>Data Tiket</h3>

<label>No Tiket</label>
<input type="text" id="notiket" placeholder="No Tiket">

<label>No Insiden</label>
<input type="text" id="insiden" placeholder="No Insiden">

<label>Tim</label>
<input type="text" id="tim" placeholder="Contoh: KENDAL">

<label>Nama</label>
<input type="text" id="nama">

<label>SID</label>
<input type="text" id="sid">

<label>Layanan (Mbps)</label>
<input type="text" id="layanan">

<label>Alamat</label>
<input type="text" id="alamat">

<label>Rootcause</label>
<input type="text" id="rootcause" placeholder="Contoh: Putus Kabel">

<label>Action</label>
<input type="text" id="action" placeholder="Contoh: Splicing">

<h3>Material Terpakai</h3>

<input type="text" id="snkabel" placeholder="SN Kabel">
<input type="text" id="snont" placeholder="SN ONT">
<input type="text" id="apc" placeholder="Pathcord APC">
<input type="text" id="upc" placeholder="Pathcord UPC">
<input type="text" id="sleeve" placeholder="Sleeve Protektor">
<input type="text" id="pigtail" placeholder="Pigtail">

<h3>Lokasi</h3>

<input type="text" id="tikoruser" placeholder="TIKOR USER">
<input type="text" id="tikorputus" placeholder="TIKOR TITIK PUTUS">

<div class="btn-group">
<button onclick="generate()">Generate Close</button>
<button onclick="copyText()">Copy</button>
<button onclick="resetForm()">Reset</button>
</div>

<textarea id="hasil" readonly placeholder="Hasil akan muncul di sini..."></textarea>

</div>

<script src="script.js"></script>

</body>
</html>
