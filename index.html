<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICONET - Generator Close Tiket</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="main-wrapper">
    <div class="form-container">
        <div class="header">
            <img src="https://iconnetsumut.com/wp-content/uploads/2023/09/logo-iconnet.webp" alt="Logo ICONET" class="logo">
            <h3>CLOSE TIKET BY jembut</h3>
        </div>

        <div class="input-group full-width">
            <label for="raw">Paste Tiket</label>
            <textarea id="raw" placeholder="Paste tiket di sini..."></textarea>
            <button class="btn-primary" onclick="ambilData()"> Generate Data</button>
        </div>

        <div class="form-section">
            <div class="form-row">
                <div class="input-group">
                    <label>No Tiket</label>
                    <input type="text" id="notiket" placeholder="Tkt-xxxxx">
                </div>
                <div class="input-group">
                    <label>No Insiden</label>
                    <input type="text" id="insiden" placeholder="INS-xxxxx">
                </div>
            </div>

            <div class="form-row">
                <div class="input-group">
                    <label>Nama Pelanggan</label>
                    <input type="text" id="nama">
                </div>
                <div class="input-group">
                    <label>SID</label>
                    <input type="text" id="sid">
                </div>
            </div>

            <div class="form-row">
                <div class="input-group">
                    <label>Layanan (Mbps)</label>
                    <input type="text" id="layanan">
                </div>
                <div class="input-group">
                    <label>Tim</label>
                    <input type="text" id="tim" placeholder="KENDAL">
                </div>
            </div>

            <div class="input-group full-width">
                <label>Alamat</label>
                <input type="text" id="alamat">
            </div>

            <div class="form-row">
                <div class="input-group">
                    <label>Rootcause</label>
                    <input type="text" id="rootcause" placeholder="Misal: Putus Kabel">
                </div>
                <div class="input-group">
                    <label>Action</label>
                    <input type="text" id="action" placeholder="Misal: Splicing">
                </div>
            </div>
        </div>

        <div class="form-section material-section">
            <div class="form-row">
                <div class="input-group">
                    <label>SN Kabel</label>
                    <input type="text" id="snkabel">
                </div>
                <div class="input-group">
                    <label>SN ONT</label>
                    <input type="text" id="snont">
                </div>
            </div>
            <div class="form-row">
                <div class="input-group">
                    <label>Pathcord APC</label>
                    <input type="text" id="apc">
                </div>
                <div class="input-group">
                    <label>Pathcord UPC</label>
                    <input type="text" id="upc">
                </div>
            </div>
            <div class="form-row">
                <div class="input-group">
                    <label>Sleeve</label>
                    <input type="text" id="sleeve">
                </div>
                <div class="input-group">
                    <label>Pigtail</label>
                    <input type="text" id="pigtail">
                </div>
            </div>
        </div>

        <div class="form-section location-section">
            <div class="form-row">
                <div class="input-group">
                    <label>Tikor User</label>
                    <input type="text" id="tikoruser" placeholder="Manual koordinat">
                </div>
                <div class="input-group">
                    <label>Tikor Titik Putus</label>
                    <input type="text" id="tikorputus" placeholder="Manual koordinat">
                </div>
            </div>
        </div>

    </div>

    <div class="control-container">
        <div class="action-buttons">
            <button class="btn-success" onclick="generate()"> Format Close</button>
            <button class="btn-copy" onclick="copyText()"> Copy</button>
            <button class="btn-danger" onclick="resetForm()">Reset</button>
        </div>
        <textarea id="hasil" readonly placeholder="Hasil format close akan muncul di sini..."></textarea>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
