<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Dalam Perbaikan</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #e67e22;
            margin-bottom: 10px;
        }
        p {
            font-size: 16px;
            line-height: 1.5;
            color: #666666;
        }
        .contact {
            margin-top: 20px;
            font-size: 14px;
            color: #888888;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Situs Sedang Dalam Perbaikan</h1>
        <p>Kami sedang melakukan pembaruan sistem untuk meningkatkan layanan. Kami akan segera kembali online.</p>
        <p>Terima kasih atas kesabaran Anda.</p>
        <div class="contact">
            Butuh bantuan mendesak? Hubungi kami di email@domain.com
        </div>
    </div>

</body>
</html>
